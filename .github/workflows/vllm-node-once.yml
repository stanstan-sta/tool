name: One-off vLLM and Node runtime regression validation

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/vllm-node-once.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Fix vLLM startup and require Node 22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Runtime metadata gate
        shell: bash
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.engines?.node !== '>=22.0.0') throw new Error('package.json Node engine mismatch');
          if (lock.packages?.['']?.engines?.node !== '>=22.0.0') throw new Error('lockfile Node engine mismatch');
          const openaiEngine = lock.packages?.['node_modules/openai']?.engines?.node;
          if (openaiEngine !== '>=22.0.0') throw new Error('OpenAI SDK engine expectation changed: ' + openaiEngine);
          NODE
      - name: Focused vLLM regression
        run: node --test test/vllm.test.js
      - name: Full Node suite
        shell: bash
        run: |
          mapfile -t tests < <(find test -maxdepth 1 -name '*.test.js' ! -name 'server_data.test.js' -print | sort)
          node --test "${tests[@]}"
      - name: Repository lint
        run: npx eslint src test main.js
      - name: Commit validated files and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/vllm-node-once.yml
          git add src/models/vllm.js test/vllm.test.js README.md package.json package-lock.json
          git commit -m "Validate vLLM startup and Node 22 requirement [skip vllm-once]"
          git push origin HEAD:beta
