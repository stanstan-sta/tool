name: Autonomous review validation

on:
  push:
    branches: [beta]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.head_commit.message != 'Remove autonomous review workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Clean install
        run: npm ci
      - name: Node regression suite
        shell: bash
        run: |
          mapfile -t tests < <(find test -maxdepth 1 -name '*.test.js' ! -name 'server_data.test.js' -print | sort)
          node --test "${tests[@]}"
      - name: bridge_agent lint
        run: npx eslint src/bridge/bridge_agent.js
      - name: Repository lint report
        shell: bash
        run: |
          set +e
          npx eslint src test main.js -f json > eslint-report.json
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('eslint-report.json','utf8'));
          const byRule = new Map();
          const byFile = [];
          let total = 0;
          for (const row of rows) {
            if (row.errorCount) byFile.push([row.filePath, row.errorCount]);
            total += row.errorCount;
            for (const m of row.messages || []) {
              if (m.severity !== 2) continue;
              const key = m.ruleId || 'parse';
              byRule.set(key, (byRule.get(key) || 0) + 1);
              console.log(`LINT ${row.filePath}:${m.line || 0}:${m.column || 0} [${key}] ${m.message}`);
            }
          }
          console.log('ESLint total errors:', total);
          console.log('By rule:', [...byRule.entries()].sort((a,b)=>b[1]-a[1]));
          console.log('Top files:', byFile.sort((a,b)=>b[1]-a[1]).slice(0,40));
          NODE
      - name: Fabric Java tests
        shell: bash
        run: |
          cd fabric-bridge-mod
          chmod +x gradlew
          ./gradlew test --no-daemon
      - name: Whitespace check
        run: git diff --check HEAD^ HEAD
      - name: Final lint gate
        run: npx eslint src test main.js
