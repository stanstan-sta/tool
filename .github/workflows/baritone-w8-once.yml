name: One-off Baritone W8 validation

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/baritone-w8-once.yml

jobs:
  validate:
    if: github.event.head_commit.message == 'Validate Baritone W8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: stanstan-sta/morebaritone
          ref: d1eb37df482fbcd547ee70d6accfedc4834f813f
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Tests
        run: ./gradlew test --no-daemon
      - name: Full build
        run: ./gradlew build -x test --no-daemon -Pmod_version=review
      - name: Verify reviewed head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "d1eb37df482fbcd547ee70d6accfedc4834f813f"
          git diff --check 8260e63b422435d955a04f3a3dd6000d776d132b..HEAD
