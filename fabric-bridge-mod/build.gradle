plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

repositories {
    // Fabric's maven is already included by the plugin
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings  "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.api:fabric-api:${project.fabric_version}"

    // Baritone is a runtime-only dependency — the user installs it as a mod.
    // We only need its API at compile time to call it directly; alternatively,
    // we call it via reflection so we don't need any compile-time dep at all.
    // (No baritone compile dependency — commands are sent as chat messages that
    //  Baritone intercepts via its ALLOW_CHAT event hook.)
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withSourcesJar()
}

jar {
    from('LICENSE') { rename { "${it}_${project.archives_base_name}" } }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
